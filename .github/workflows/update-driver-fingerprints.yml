name: Update driver fingerprints

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: update-driver-fingerprints
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test fingerprint generator
        run: python test/catalog_driver_fingerprints_test.py

      - name: Fetch all upstream tags and blobs
        # A bare mirror reads the actual Git blobs without checking out DLLs
        # or converting Git LFS pointers into downloaded files.
        run: git clone --mirror https://github.com/sdli1995/dlssg_for_sm86 "$RUNNER_TEMP/dlssg-for-sm86-upstream.git"

      - name: Generate fingerprint catalog
        run: python tool/catalog_driver_fingerprints.py "$RUNNER_TEMP/dlssg-for-sm86-upstream.git"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/update-driver-fingerprints
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: driver-fingerprints.json
          commit-message: 'chore: update driver fingerprints'
          title: 'chore: update driver fingerprints'
          body: |
            Regenerate `driver-fingerprints.json` from all tags in
            [sdli1995/dlssg_for_sm86](https://github.com/sdli1995/dlssg_for_sm86).

            Validation:
            - Fingerprint generator regression tests passed.
            - Every cataloged Git blob was verified against its object ID;
              SHA-256 fingerprints were computed from the original bytes.

            This PR is updated in place when the upstream catalog changes.
