name: Validate Mod release package

on:
  release: { types: [published] }

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upstream snapshot tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#refs/tags/}"
          if ! [[ "$tag" =~ ^[0-9a-f]{7}$ ]]; then
            echo 'This is not a Mod snapshot release; skipping.'
            exit 0
          fi
          if ! gh release download "$GITHUB_REF_NAME" --pattern 'dlssg_for_sm86.tar.gz'; then
            echo 'This release has no matching Mod snapshot archive; skipping.'
            exit 0
          fi
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          catalog=json.load(open('mod-hash-catalog.json', encoding='utf-8'))
          commit=catalog['source']['head_commit'].lower()
          tag=os.environ['GITHUB_REF_NAME'].removeprefix('refs/tags/')
          assert tag == commit[:7], 'release tag must be the upstream short commit'
          expected={item['path']: item['sha256'].lower() for item in catalog['latest']['files']}
          archive='dlssg_for_sm86.tar.gz'
          with tarfile.open(archive, 'r:gz') as tar:
              names=[member.name for member in tar.getmembers()]
              prefix=names[0].split('/', 1)[0]
              assert prefix and all(name == prefix or name.startswith(prefix + '/') for name in names)
              for path in ['version.dll', 'altnative/dinput8.dll', 'altnative/dxgi.dll', 'altnative/winhttp.dll', 'altnative/winmm.dll']:
                  member=tar.extractfile(f'{prefix}/{path}')
                  assert member is not None, f'archive missing {path}'
                  actual=hashlib.sha256(member.read()).hexdigest().lower()
                  assert actual == expected[path], f'bad hash: {path}'
              assert tar.extractfile(f'{prefix}/dlssg_sm86.ini') is not None
          PY
