name: Build upstream DLL hash catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the complete upstream repository history
        run: git clone --mirror https://github.com/sdli1995/dlssg_for_sm86.git upstream.git
      - name: Build latest and historical DLL SHA-256 catalog
        run: >-
          python3 tool/build_dll_hash_catalog.py --repo upstream.git
          --head-ref refs/heads/main
          --latest-path version.dll --latest-path 'altnative/*.dll'
          --output mod-hash-catalog.json
      - name: Check catalog structure
        run: |
          python3 - <<'PY'
          import json
          catalog = json.load(open('mod-hash-catalog.json', encoding='utf-8'))
          assert catalog['schema_version'] == 2
          assert catalog['latest']['files']
          assert isinstance(catalog['historical']['files'], list)
          latest = {entry['sha256'] for entry in catalog['latest']['files']}
          historical = {entry['sha256'] for entry in catalog['historical']['files']}
          assert latest.isdisjoint(historical), 'latest and historical hashes overlap'
          assert set(catalog['hashes']) == latest | historical
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mod-hash-catalog
          path: mod-hash-catalog.json
          if-no-files-found: error
      - name: Commit the current catalog to the repository root
        run: |
          if git diff --quiet -- mod-hash-catalog.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mod-hash-catalog.json
          git commit -m 'chore: update Mod hash catalog'
          git push
      - name: Publish upstream main snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(python3 -c "import json; print(json.load(open('mod-hash-catalog.json'))['source']['head_commit'])")"
          tag="${commit:0:7}"
          archive="snapshot/dlssg_for_sm86.tar.gz"
          mkdir -p snapshot
          curl --fail --location --retry 3 \
            "https://github.com/sdli1995/dlssg_for_sm86/archive/${commit}.tar.gz" \
            --output "$archive"
          tar -tzf "$archive" | grep -qx ".*/version.dll"
          tar -tzf "$archive" | grep -qx ".*/dlssg_sm86.ini"
          python3 - "$archive" <<'PY'
          import hashlib, json, sys, tarfile
          catalog=json.load(open('mod-hash-catalog.json', encoding='utf-8'))
          expected={item['path']: item['sha256'].lower() for item in catalog['latest']['files']}
          with tarfile.open(sys.argv[1], 'r:gz') as tar:
              names=[member.name for member in tar.getmembers()]
              prefix=names[0].split('/', 1)[0]
              for path in ['version.dll', 'altnative/dinput8.dll', 'altnative/dxgi.dll', 'altnative/winhttp.dll', 'altnative/winmm.dll']:
                  member=tar.extractfile(f'{prefix}/{path}')
                  assert member is not None, f'archive missing {path}'
                  assert hashlib.sha256(member.read()).hexdigest().lower() == expected[path], f'bad hash: {path}'
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete-asset "$tag" "${tag}.tar.gz" --yes || true
            gh release delete-asset "$tag" mod-hash-catalog.json --yes || true
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --title "dlssg_for_sm86 ${tag}" \
              --notes "Upstream main commit: ${commit}"
          fi
