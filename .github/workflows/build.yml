name: Build portable manager

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        run: |
          .\tool\package_windows.ps1

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: release/dlssg-for-sm86-manager-portable.zip
