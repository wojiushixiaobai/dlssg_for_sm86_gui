name: Build portable manager

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: .\tool\package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DLSSG-for-SM86-Manager-windows-x64
          path: release/dlssg-for-sm86-manager-portable.zip
