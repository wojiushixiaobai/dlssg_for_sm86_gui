name: Build portable manager

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare latest offline driver
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\tool\prepare_drivers.ps1

      - name: Build portable package
        shell: pwsh
        run: |
          .\tool\package_windows.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: dlssg-for-sm86-manager-portable
          path: release/dlssg-for-sm86-manager-portable.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: release/dlssg-for-sm86-manager-portable.zip
